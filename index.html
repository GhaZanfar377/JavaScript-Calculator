<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="calculator">
        <!-- Top Inputs -->
        <div class="main-text-area">
          <div class="user-input-container">
            <span class="user-input-display"></span>
            <span class="blinking-cursor"></span>
          </div>
          <span class="results"></span>
        </div>
        <!-------- Math Buttons ----------->
        <div class="math-button-container">
          <button class="math-button" data-value="√">√</button>
          <button class="math-button" data-value="%">
            <i class="fa-solid fa-percent"></i>
          </button>
          <button class="math-button" data-value="x²" >x²</button>
          <button class="math-button" data-value="1/x" >1/x</button>
        </div>
        <!-------- Lower Buttons ----------->
        <div class="lower-button-container">
            <!-------- Lower Left Buttons ----------->
          <div class="left-lower-button-container">
            <button class="AC-btn " data-action="cross-all">AC</button>
            <button class="cross-btn " data-action="delete-top">
              <i class="fa-solid fa-delete-left"></i>
            </button>
            <button class="lower-left-btn" data-value="/">
              <i class="fa-solid fa-divide"></i>
            </button>
            <button class="lower-left-btn number-btns" data-value="7">
              <i class="fa-solid fa-7"></i>
            </button>
            <button class="lower-left-btn number-btns" data-value="8">
              <i class="fa-solid fa-8"></i>
            </button>
            <button class="lower-left-btn number-btns" data-value="9">
              <i class="fa-solid fa-9"></i>
            </button>
            <button class="lower-left-btn number-btns" data-value="4">
              <i class="fa-solid fa-4"></i>
            </button>
            <button class="lower-left-btn number-btns" data-value="5">
              <i class="fa-solid fa-5"></i>
            </button>
            <button class="lower-left-btn number-btns" data-value="6">
              <i class="fa-solid fa-6"></i>
            </button>
            <button class="lower-left-btn number-btns" data-value="1">
              <i class="fa-solid fa-1"></i>
            </button>
            <button class="lower-left-btn number-btns" data-value="2">
              <i class="fa-solid fa-2"></i>
            </button>
            <button class="lower-left-btn number-btns" data-value="3">
              <i class="fa-solid fa-3"></i>
            </button>
            <button class="lower-left-btn number-btns" id="zero-btn" data-value="0">
              <i class="fa-solid fa-0"></i>
            </button>
            <button class="lower-left-btn" data-value=".">
              .
            </button>
          </div>

          <!-------- Lower Right Buttons ----------->
          <div class="right-lower-button-container">
            <button class="lower-right-btn" data-value="×">
              <i class="fa-solid fa-xmark"></i>
            </button>
            <button class="lower-right-btn" data-value="-">
              <i class="fa-solid fa-minus"></i>
            </button>
            <button class="lower-right-btn" id="plus-btn" data-value="+">
              <i class="fa-solid fa-plus"></i>
            </button>
            <button class="lower-right-btn equals-button" id="equalTo-btn" data-action="=" >
              <i class="fa-solid fa-equals"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <script src="script.js"></script>
  </body>
</html>
